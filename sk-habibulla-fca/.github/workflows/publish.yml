name: Stage package on npm

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stage-npm:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Install npm CLI with staged publishing
        run: npm install -g npm@latest

      - name: Check package code
        run: npm run check

      - name: Run tests
        run: npm test

      - name: Stage package to npm (requires approval on npmjs.com)
        run: npm stage publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
